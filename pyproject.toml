[project]
name = "novatrek"
version = "2.0.0"
description = "Autonomous multi-agent travel mission planner — parallel agents, live streaming, zero-key offline mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "airportsdata>=20240101",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
novatrek = "novatrek.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["novatrek*"]

[tool.setuptools.package-data]
novatrek = ["web/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
